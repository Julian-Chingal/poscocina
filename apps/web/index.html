<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>poscocina — Sistema POS Gastronómico</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // Aislamiento de scripts externos (Cloudflare Insights, Beacon) para evitar interrupciones en la app
      (function() {
        window.addEventListener('error', function(event) {
          var src = (event && (event.filename || (event.target && event.target.src))) || '';
          if (typeof src === 'string' && (src.indexOf('cloudflareinsights') !== -1 || src.indexOf('beacon.min.js') !== -1)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = (event && event.reason) ? String(event.reason.message || event.reason.stack || event.reason) : '';
          if (reason.indexOf('cloudflare') !== -1 || reason.indexOf('beacon') !== -1 || reason.indexOf('insights') !== -1) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        });
      })();
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('poscocina_font_size');
          if (saved) {
            var size = parseInt(saved, 10);
            if (!isNaN(size) && size >= 12 && size <= 24) {
              document.documentElement.style.fontSize = size + 'px';
              document.documentElement.style.setProperty('--app-font-size', size + 'px');
            }
          }
          if (localStorage.getItem('poscocina_high_contrast') === 'true') {
            document.documentElement.classList.add('font-high-contrast');
          }
          var primary = localStorage.getItem('poscocina_primary_color');
          if (primary) document.documentElement.style.setProperty('--primary-brand', primary);
          var secondary = localStorage.getItem('poscocina_secondary_color');
          if (secondary) document.documentElement.style.setProperty('--secondary-brand', secondary);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-background text-foreground min-h-screen selection:bg-primary selection:text-primary-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
