map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Backend API Reverse Proxy (comunicación interna con poscocina-server)
    location /api/ {
        proxy_pass http://poscocina-server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts de proxy
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket Reverse Proxy (Socket.io en tiempo real para cocina/comandas)
    location /socket.io/ {
        proxy_pass http://poscocina-server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keepalive prolongado para WebSockets
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Healthcheck proxy hacia el backend
    location /health {
        proxy_pass http://poscocina-server:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Static Assets con caché prolongada e inmutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Frontend Single Page Application (SPA Fallback a index.html)
    location / {
        try_files $uri $uri/ /index.html;
        # Evitar caché en index.html para recargas limpias tras despliegue
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
