# ==============================================================================
# poscocina - Entorno de Desarrollo / QA / Staging (Docker Compose)
# ==============================================================================
# Ejecuta imágenes compiladas de producción (Fastify compilado y Nginx para Web)
# pero manteniendo los puertos y configuraciones parametrizadas con variables
# de entorno para evitar colisiones en QA, VPS o con servicios locales.
#
# Uso:
#   - Levantar todo (Server compilado + Nginx + BD + Valkey):
#       pnpm docker:dev  O  docker compose -f docker-compose.dev.yml up -d --build
#   - Levantar solo infraestructura (BD + Valkey para correr pnpm dev:all en host):
#       pnpm docker:dev:db  O  docker compose -f docker-compose.dev.yml up -d postgres valkey
#   - Ver logs:
#       pnpm docker:dev:logs
#   - Apagar:
#       pnpm docker:dev:down
# ==============================================================================

services:
  postgres:
    container_name: poscocina-postgres-dev
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-posuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pospassword_seguro_produccion_2026}
      POSTGRES_DB: ${DB_NAME:-poscocina}
    ports:
      - "${DEV_DB_PORT:-${DB_PORT:-5433}}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-posuser} -d ${DB_NAME:-poscocina}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      poscocina-dev-network:
        aliases:
          - poscocina-postgres-dev
          - postgres

  valkey:
    container_name: poscocina-valkey-dev
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "${DEV_VALKEY_PORT:-${VALKEY_PORT:-6380}}:6379"
    volumes:
      - valkey_dev_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      poscocina-dev-network:
        aliases:
          - poscocina-valkey-dev
          - valkey
          - poscocina-redis-dev
          - redis

  server:
    container_name: poscocina-server-dev
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://${DB_USER:-posuser}:${DB_PASSWORD:-pospassword_seguro_produccion_2026}@postgres:5432/${DB_NAME:-poscocina}}
      VALKEY_URL: ${DOCKER_VALKEY_URL:-redis://valkey:6379}
      REDIS_URL: ${DOCKER_VALKEY_URL:-redis://valkey:6379}
      VALKEY_HOST: ${VALKEY_HOST:-${REDIS_HOST:-valkey}}
      VALKEY_PORT: ${VALKEY_PORT:-${REDIS_PORT:-6379}}
      JWT_SECRET: ${JWT_SECRET:-poscocina_super_secret_production_key_32_chars_2026!}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:5174,http://localhost:3000,*}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEED: ${RUN_SEED:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@poscocina.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_PIN: ${ADMIN_PIN:-1234}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-${S3_BUCKET:-${GARAGE_S3_BUCKET:-catastrocol-cargues}}}
      STORAGE_PATH: ${STORAGE_PATH:-gastropos}
      GARAGE_S3_ENDPOINT: ${GARAGE_S3_ENDPOINT:-${S3_ENDPOINT:-http://garage:3900}}
      GARAGE_S3_REGION: ${GARAGE_S3_REGION:-${S3_REGION:-garage}}
      GARAGE_S3_BUCKET: ${STORAGE_BUCKET:-${S3_BUCKET:-${GARAGE_S3_BUCKET:-catastrocol-cargues}}}
      GARAGE_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY_ID:-${S3_ACCESS_KEY_ID:-}}
      GARAGE_SECRET_ACCESS_KEY: ${GARAGE_SECRET_ACCESS_KEY:-${S3_SECRET_ACCESS_KEY:-}}
      PUBLIC_STORAGE_URL: ${PUBLIC_STORAGE_URL:-${S3_PUBLIC_URL:-}}
      S3_ENDPOINT: ${S3_ENDPOINT:-${GARAGE_S3_ENDPOINT:-http://garage:3900}}
      S3_REGION: ${S3_REGION:-${GARAGE_S3_REGION:-garage}}
      S3_BUCKET: ${S3_BUCKET:-${STORAGE_BUCKET:-${GARAGE_S3_BUCKET:-catastrocol-cargues}}}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-${GARAGE_ACCESS_KEY_ID:-}}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-${GARAGE_SECRET_ACCESS_KEY:-}}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-poscocina <onboarding@resend.dev>}
      APP_URL: ${APP_URL:-http://localhost:5173}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "${DEV_PORT:-${PORT:-3000}}:3000"
    volumes:
      - server_dev_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      poscocina-dev-network:
        aliases:
          - poscocina-server-dev
          - poscocina-server
          - server

  client:
    container_name: poscocina-client-dev
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_DELIVERY_URL: ${VITE_DELIVERY_URL:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID:-}}
    restart: unless-stopped
    ports:
      - "${DEV_CLIENT_PORT:-${CLIENT_PORT:-5173}}:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      poscocina-dev-network:
        aliases:
          - poscocina-client-dev
          - poscocina-client
          - client

  delivery:
    container_name: poscocina-delivery-dev
    build:
      context: .
      dockerfile: apps/delivery/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://poscocina-server-dev:3000}
      BACKEND_API_URL: ${BACKEND_API_URL:-http://poscocina-server-dev:3000/api}
      BACKEND_UPLOADS_URL: ${BACKEND_UPLOADS_URL:-http://poscocina-server-dev:3000/uploads}
    ports:
      - "${DEV_DELIVERY_PORT:-${DELIVERY_PORT:-3001}}:3001"
    depends_on:
      server:
        condition: service_healthy
    networks:
      poscocina-dev-network:
        aliases:
          - poscocina-delivery-dev
          - poscocina-delivery
          - delivery

networks:
  poscocina-dev-network:
    name: poscocina-dev-network
    driver: bridge

volumes:
  postgres_dev_data:
    name: poscocina_postgres_dev_data
  valkey_dev_data:
    name: poscocina_valkey_dev_data
  server_dev_uploads:
    name: poscocina_server_dev_uploads
