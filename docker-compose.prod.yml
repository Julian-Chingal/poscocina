# docker-compose.prod.yml
# Utiliza este archivo si deseas levantar el cliente empaquetado en contenedor Nginx:
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  client:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: poscocina-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      poscocina-network:
        aliases:
          - poscocina-client
          - client
