services:
  postgres:
    image: postgres:16-alpine
    container_name: poscocina-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-posuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pospassword}
      POSTGRES_DB: ${DB_NAME:-poscocina}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-posuser} -d ${DB_NAME:-poscocina}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      poscocina-network:
        aliases:
          - poscocina-postgres
          - postgres
    # En producción / Dokploy no se exponen puertos de BD al host (el server se conecta por red interna).
    # Descomentar únicamente para depuración local con DBeaver/PgAdmin desde tu máquina:
    # ports:
    #   - "${DB_PORT:-5432}:5432"

  valkey:
    image: valkey/valkey:8-alpine
    container_name: poscocina-valkey
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      poscocina-network:
        aliases:
          - poscocina-valkey
          - valkey
          - poscocina-redis
          - redis
    # En producción / Dokploy no se expone Valkey al exterior:
    # ports:
    #   - "${VALKEY_PORT:-${REDIS_PORT:-6379}}:6379"

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: poscocina-server
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: ${DOCKER_DATABASE_URL:-${DATABASE_URL:-postgresql://${DB_USER:-posuser}:${DB_PASSWORD:-pospassword}@postgres:5432/${DB_NAME:-poscocina}}}
      VALKEY_URL: ${DOCKER_VALKEY_URL:-${VALKEY_URL:-${DOCKER_REDIS_URL:-${REDIS_URL:-redis://valkey:6379}}}}
      REDIS_URL: ${DOCKER_VALKEY_URL:-${VALKEY_URL:-${DOCKER_REDIS_URL:-${REDIS_URL:-redis://valkey:6379}}}}
      VALKEY_HOST: ${VALKEY_HOST:-${REDIS_HOST:-valkey}}
      VALKEY_PORT: ${VALKEY_PORT:-${REDIS_PORT:-6379}}
      JWT_SECRET: ${JWT_SECRET:-poscocina_jwt_super_secret_production_key_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEED: ${RUN_SEED:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@poscocina.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_PIN: ${ADMIN_PIN:-1234}
      # Almacenamiento Multimedia (S3 / MinIO / Garage / Filestash / Local)
      STORAGE_BUCKET: ${STORAGE_BUCKET:-${GARAGE_S3_BUCKET:-catastrocol-cargues}}
      STORAGE_PATH: ${STORAGE_PATH:-gastropos}
      GARAGE_S3_ENDPOINT: ${GARAGE_S3_ENDPOINT:-http://garage:3900}
      GARAGE_S3_REGION: ${GARAGE_S3_REGION:-garage}
      GARAGE_S3_BUCKET: ${STORAGE_BUCKET:-${GARAGE_S3_BUCKET:-catastrocol-cargues}}
      GARAGE_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY_ID:-}
      GARAGE_SECRET_ACCESS_KEY: ${GARAGE_SECRET_ACCESS_KEY:-}
      PUBLIC_STORAGE_URL: ${PUBLIC_STORAGE_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-poscocina <onboarding@resend.dev>}
      APP_URL: ${APP_URL:-http://localhost:5173}
    volumes:
      - server_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      poscocina-network:
        aliases:
          - poscocina-server
          - server

  client:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: poscocina-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      poscocina-network:
        aliases:
          - poscocina-client
          - client

networks:
  poscocina-network:
    name: poscocina-network
    driver: bridge

volumes:
  postgres_data:
    name: poscocina_postgres_data
  valkey_data:
    name: poscocina_valkey_data
  server_uploads:
    name: poscocina_server_uploads

